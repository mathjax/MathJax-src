name: Release

on:
  release:
    types: [published]

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    name: Build and publish MathJax
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - uses: pnpm/setup@v3
        name: Install pnpm, Node.js and packages
        with:
          version: 12
          runtime: node@26

      - name: Build MathJax
        run: |
          ./components/bin/version
          pnpm --silent link:src
          pnpm --silent build-all
        
      - name: Publish to npmjs
        run: pnpm publish --provenance --no-git-checks
